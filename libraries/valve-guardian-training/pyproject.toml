[project]
name = "valve-guardian-training"
version = "2.0.1"
description = "Benchmark, select, train and export to ONNX the valve guardian model."
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
dependencies = [
  "httpx>=0.28.1",
  "numpy>=2.5.4",
  "onnxmltools>=1.16.0",
  "scikit-learn>=1.9.1",
  "skl2onnx>=1.20.0",
  "valve-guardian",
  "valve-guardian-contract",
  "xgboost-cpu>=3.4.1",
]

[project.optional-dependencies]
mlflow = [
  "mlflow-skinny>=3.18.0",
  "pandas>=3.1.1",
]

[project.scripts]
valve-guardian-training = "valve_guardian_training.workflows.cli:main"

[tool.uv.sources]
valve-guardian = { workspace = true }
valve-guardian-contract = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/valve_guardian_training"]
