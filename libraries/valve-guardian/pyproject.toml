[project]
name = "valve-guardian"
version = "2.0.1"
description = "Features and ONNX inference of the valve condition of a hydraulic rig."
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
dependencies = [
  "numpy>=2.5.4",
  "onnxruntime>=1.32.0",
  "valve-guardian-contract",
]

[tool.uv.sources]
valve-guardian-contract = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/valve_guardian"]
