global:
  fullnameOverride: valve-guardian
  createDefaultServiceAccount: false
  registry: ""
  imageTag: dev

defaultPodOptions:
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
