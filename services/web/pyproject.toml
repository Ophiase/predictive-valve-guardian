[project]
name = "valve-guardian-web"
version = "2.0.0"
description = "A server-rendered page over the valve guardian API: upload cycles, read verdicts."
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
dependencies = [
  "fastapi>=0.163.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "numpy>=2.5.4",
  "pydantic-settings>=2.16.3",
  "python-multipart>=0.0.33",
  "uvicorn>=0.54.0",
  "valve-guardian-contract",
]

[project.scripts]
valve-guardian-web = "valve_guardian_web.application:main"

[tool.uv.sources]
valve-guardian-contract = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/valve_guardian_web"]
