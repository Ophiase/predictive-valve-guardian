extends: default

rules:
  braces: { min-spaces-inside: 1, max-spaces-inside: 1 }
  brackets: { min-spaces-inside: 0, max-spaces-inside: 0 }
  comments: { min-spaces-from-content: 1 }
  document-start: disable
  empty-values: { forbid-in-block-mappings: true, forbid-in-flow-mappings: true }
  float-values: { require-numeral-before-decimal: true, forbid-nan: true, forbid-inf: true }
  indentation: { spaces: 2, indent-sequences: true }
  line-length: { max: 120 }
  octal-values: enable
  quoted-strings: { quote-type: double, required: only-when-needed }
  truthy: { allowed-values: ["true", "false"], check-keys: false }
