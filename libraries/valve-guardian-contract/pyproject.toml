[project]
name = "valve-guardian-contract"
version = "2.0.0"
description = "The pydantic contract between the valve guardian API, its clients and its training."
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
dependencies = ["pydantic>=2.13"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/valve_guardian_contract"]
