[project]
name = "valve-guardian"
version = "1.3.0"
description = "Features, training and prediction of the valve condition of a hydraulic rig."
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
dependencies = [
  "httpx>=0.28.1",
  "numpy>=2.5.4",
  "pandas>=3.1.1",
  "scikit-learn>=1.9.1",
  "xgboost-cpu>=3.4.1",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/valve_guardian"]
