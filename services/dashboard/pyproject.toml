[project]
name = "valve-guardian-dashboard"
version = "1.3.0"
description = "A Streamlit page that predicts the valve condition of uploaded cycles."
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
dependencies = [
  "numpy>=2.5.4",
  "pandas>=3.1.1",
  "streamlit>=1.67.0",
  "valve-guardian",
]

[project.scripts]
valve-guardian-dashboard = "valve_guardian_dashboard.__main__:main"

[tool.uv.sources]
valve-guardian = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/valve_guardian_dashboard"]
