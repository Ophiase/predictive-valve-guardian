[project]
name = "predictive-valve-guardian"
version = "1.3.0"
description = "Predict the valve condition of a hydraulic rig from its pressure and flow signals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
dependencies = [
  "valve-guardian",
  "valve-guardian-dashboard",
]

[tool.uv]
package = false

[tool.uv.sources]
valve-guardian = { workspace = true }
valve-guardian-dashboard = { workspace = true }

[tool.uv.workspace]
members = [
  "libraries/*",
  "services/*",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.5",
  "ty>=0.0.104",
]

[tool.pytest.ini_options]
testpaths = ["libraries/valve-guardian/tests/unit"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
