[project]
name = "predictive-valve-guardian"
version = "2.0.0"
description = "Predict the valve condition of a hydraulic rig from its pressure and flow signals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Ophiase" }]
dependencies = [
  "valve-guardian",
  "valve-guardian-api",
  "valve-guardian-contract",
  "valve-guardian-training",
  "valve-guardian-web",
]

[tool.uv]
package = false
default-groups = [
  "dev",
  "tracking",
]

[tool.uv.sources]
valve-guardian = { workspace = true }
valve-guardian-api = { workspace = true }
valve-guardian-contract = { workspace = true }
valve-guardian-training = { workspace = true }
valve-guardian-web = { workspace = true }

[tool.uv.workspace]
members = [
  "libraries/*",
  "services/*",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.5",
  "ty>=0.0.104",
]
tracking = ["valve-guardian-training[mlflow]"]

[tool.pytest.ini_options]
testpaths = [
  "libraries",
  "services",
]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
